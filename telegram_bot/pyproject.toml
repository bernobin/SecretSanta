
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-santa-telegram-bot"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [ 
    "python-telegram-bot>=22,<23", 
    "httpx>=0.28,<0.29", 
    "attrs>=22.2.0", 
]

[project.optional-dependencies] 
dev = [ 
    "pytest", 
    "pyright", 
    "openapi-python-client==0.29.1", 
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
ignore = ["src/secret_santa_bot/generated_client/**"]
